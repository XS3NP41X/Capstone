<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <rect width="1400" height="900" fill="#f6faf7"/>
  <style>
    text { font-family: Arial, sans-serif; fill: #173326; }
    .title { font-size: 30px; font-weight: 700; }
    .label { font-size: 19px; font-weight: 700; }
    .small { font-size: 15px; }
    .tiny { font-size: 12px; }
    .bb { fill: #fff; stroke: #c6d8ce; stroke-width: 3; rx: 18; }
    .railp { stroke: #d93636; stroke-width: 4; }
    .railn { stroke: #2176c9; stroke-width: 4; }
    .hole { fill: #dfe8e2; stroke: #9fb1a7; stroke-width: 1; }
    .hole.hot { fill: #ffd84d; stroke: #173326; stroke-width: 3; }
    .wire-red { stroke: #d93636; stroke-width: 8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .wire-black { stroke: #111; stroke-width: 8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .wire-green { stroke: #168f5a; stroke-width: 8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .res { stroke: #2d82bd; stroke-width: 8; fill: none; stroke-linecap: round; }
    .board { fill: #fff; stroke: #9ab5a7; stroke-width: 3; rx: 14; }
    .pin { fill: #eef7f0; stroke: #6a8c7a; stroke-width: 2; }
  </style>

  <text x="60" y="55" class="title">Breadboard Wiring: Arduino A4 to ESP32 GPIO16 Voltage Divider</text>
  <text x="60" y="86" class="small">Use row 49 as the midpoint: 1k end + 2k end + ESP32 GPIO16 all share row 49.</text>

  <rect x="420" y="130" width="560" height="660" class="bb"/>
  <line x1="445" y1="165" x2="955" y2="165" class="railp"/>
  <line x1="445" y1="195" x2="955" y2="195" class="railn"/>
  <line x1="445" y1="725" x2="955" y2="725" class="railp"/>
  <line x1="445" y1="755" x2="955" y2="755" class="railn"/>
  <text x="458" y="157" class="small">+ rail</text>
  <text x="458" y="217" class="small">GND rail</text>
  <text x="458" y="777" class="small">GND rail</text>

  <line x1="700" y1="230" x2="700" y2="690" stroke="#dde8e1" stroke-width="18"/>

  <text x="488" y="250" class="tiny">a</text><text x="538" y="250" class="tiny">b</text><text x="588" y="250" class="tiny">c</text><text x="638" y="250" class="tiny">d</text><text x="688" y="250" class="tiny">e</text>
  <text x="728" y="250" class="tiny">f</text><text x="778" y="250" class="tiny">g</text><text x="828" y="250" class="tiny">h</text><text x="878" y="250" class="tiny">i</text><text x="928" y="250" class="tiny">j</text>

  <!-- simplified rows 46-52 -->
  <g>
    <text x="448" y="306" class="small">46</text>
    <text x="448" y="356" class="small">47</text>
    <text x="448" y="406" class="small">48</text>
    <text x="448" y="456" class="small">49</text>
    <text x="448" y="506" class="small">50</text>
    <text x="448" y="556" class="small">51</text>
    <text x="448" y="606" class="small">52</text>
  </g>

  <g id="holes">
    <!-- left side holes -->
    <circle cx="500" cy="300" r="8" class="hole"/><circle cx="550" cy="300" r="8" class="hole"/><circle cx="600" cy="300" r="8" class="hole"/><circle cx="650" cy="300" r="8" class="hole"/>
    <circle cx="500" cy="350" r="8" class="hole"/><circle cx="550" cy="350" r="8" class="hole"/><circle cx="600" cy="350" r="8" class="hole"/><circle cx="650" cy="350" r="8" class="hole"/>
    <circle cx="500" cy="400" r="8" class="hole"/><circle cx="550" cy="400" r="8" class="hole"/><circle cx="600" cy="400" r="8" class="hole"/><circle cx="650" cy="400" r="8" class="hole"/>
    <circle cx="500" cy="450" r="8" class="hole hot"/><circle cx="550" cy="450" r="8" class="hole hot"/><circle cx="600" cy="450" r="8" class="hole hot"/><circle cx="650" cy="450" r="8" class="hole hot"/>
    <circle cx="500" cy="500" r="8" class="hole"/><circle cx="550" cy="500" r="8" class="hole"/><circle cx="600" cy="500" r="8" class="hole"/><circle cx="650" cy="500" r="8" class="hole"/>
    <circle cx="500" cy="550" r="8" class="hole"/><circle cx="550" cy="550" r="8" class="hole"/><circle cx="600" cy="550" r="8" class="hole"/><circle cx="650" cy="550" r="8" class="hole"/>
    <circle cx="500" cy="600" r="8" class="hole"/><circle cx="550" cy="600" r="8" class="hole"/><circle cx="600" cy="600" r="8" class="hole"/><circle cx="650" cy="600" r="8" class="hole"/>
    <!-- right side holes -->
    <circle cx="750" cy="300" r="8" class="hole"/><circle cx="800" cy="300" r="8" class="hole"/><circle cx="850" cy="300" r="8" class="hole"/><circle cx="900" cy="300" r="8" class="hole"/>
    <circle cx="750" cy="350" r="8" class="hole"/><circle cx="800" cy="350" r="8" class="hole"/><circle cx="850" cy="350" r="8" class="hole"/><circle cx="900" cy="350" r="8" class="hole"/>
    <circle cx="750" cy="400" r="8" class="hole"/><circle cx="800" cy="400" r="8" class="hole"/><circle cx="850" cy="400" r="8" class="hole"/><circle cx="900" cy="400" r="8" class="hole"/>
    <circle cx="750" cy="450" r="8" class="hole hot"/><circle cx="800" cy="450" r="8" class="hole hot"/><circle cx="850" cy="450" r="8" class="hole hot"/><circle cx="900" cy="450" r="8" class="hole hot"/>
    <circle cx="750" cy="500" r="8" class="hole"/><circle cx="800" cy="500" r="8" class="hole"/><circle cx="850" cy="500" r="8" class="hole"/><circle cx="900" cy="500" r="8" class="hole"/>
    <circle cx="750" cy="550" r="8" class="hole"/><circle cx="800" cy="550" r="8" class="hole"/><circle cx="850" cy="550" r="8" class="hole"/><circle cx="900" cy="550" r="8" class="hole"/>
    <circle cx="750" cy="600" r="8" class="hole"/><circle cx="800" cy="600" r="8" class="hole"/><circle cx="850" cy="600" r="8" class="hole"/><circle cx="900" cy="600" r="8" class="hole"/>
  </g>

  <!-- boards -->
  <rect x="55" y="230" width="250" height="310" class="board"/>
  <text x="120" y="270" class="label">Arduino Uno</text>
  <rect x="95" y="325" width="170" height="44" class="pin"/>
  <text x="145" y="353" class="label">A4</text>
  <rect x="95" y="405" width="170" height="44" class="pin"/>
  <text x="145" y="433" class="label">D5</text>
  <rect x="95" y="485" width="170" height="44" class="pin"/>
  <text x="137" y="513" class="label">GND</text>

  <rect x="1090" y="230" width="250" height="310" class="board"/>
  <text x="1182" y="270" class="label">ESP32</text>
  <rect x="1130" y="325" width="170" height="44" class="pin"/>
  <text x="1160" y="353" class="label">GPIO16</text>
  <rect x="1130" y="405" width="170" height="44" class="pin"/>
  <text x="1160" y="433" class="label">GPIO17</text>
  <rect x="1130" y="485" width="170" height="44" class="pin"/>
  <text x="1177" y="513" class="label">GND</text>

  <!-- A4 voltage divider -->
  <path d="M265 347 C345 347, 390 347, 455 347 C485 347, 500 370, 500 400" class="wire-red"/>
  <text x="326" y="323" class="small">Arduino A4 wire</text>
  <path d="M500 400 L500 450" class="res"/>
  <text x="512" y="428" class="small">1k</text>

  <path d="M550 450 C760 450, 905 450, 1130 347" class="wire-red"/>
  <text x="720" y="430" class="small">ESP32 GPIO16 wire connects to row 49</text>

  <path d="M600 450 L600 600" class="res"/>
  <path d="M600 600 C600 650, 740 690, 900 755" class="wire-black"/>
  <text x="612" y="530" class="small">2k</text>
  <text x="612" y="624" class="small">to GND rail</text>

  <!-- command and ground wires -->
  <path d="M1130 427 C965 390, 635 350, 265 427" class="wire-green"/>
  <text x="575" y="338" class="small">ESP32 GPIO17 direct to Arduino D5</text>

  <path d="M265 507 C415 665, 830 665, 1130 507" class="wire-black"/>
  <text x="555" y="697" class="small">Arduino GND and ESP32 GND must be common</text>

  <rect x="70" y="812" width="1260" height="55" fill="#fff" stroke="#d5e3da" stroke-width="2" rx="10"/>
  <text x="95" y="846" class="small">Row 49 is highlighted yellow. Only the midpoint belongs there: 1k end + 2k end + ESP32 GPIO16. Arduino A4 is on the other side of the 1k. GND is on the other side of the 2k.</text>
</svg>
